name: Deploy Bunny JS searchapi twin

# Deploys the bunny Edge Script twin of the searchapi seller. Coexists with manual CLI
# deploys by design: bunny publishes whichever deployment happened last, so a manual
# `bunny scripts deploy` from a laptop stays live only until the next push to main.
#
# This workflow ships CODE only. The script's environment (BRAVE_API_KEY, the receiver
# authorizer key, the S3 channel-store credentials, RPC URLs, SEARCH_SERVICE_URL) is
# configured on the script itself — bunny dashboard or `bunny scripts env set` — and is
# deliberately not part of CI: a repo leak must not be a secrets leak.

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "bunny_js/**"
      - "shared/chain-utils/**"
      - "shared/s3-utils/**"
      - ".github/workflows/deploy-bunny-js.yml"

jobs:
  deploy-bunny-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            bunny_js/package-lock.json
            shared/chain-utils/package-lock.json
            shared/s3-utils/package-lock.json

      # Repo ordering rule (AGENTS.md -> Commands): the shared file: dependencies must be
      # built before bunny_js can build against them.
      - name: Install and build chain-utils
        working-directory: ./shared/chain-utils
        run: npm ci && npm run build

      - name: Install and build s3-utils
        working-directory: ./shared/s3-utils
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: ./bunny_js
        run: npm ci

      - name: Build the single-file bundle
        working-directory: ./bunny_js
        run: npm run build

      - name: Deploy script to Bunny Edge Scripting
        uses: BunnyWay/actions/deploy-script@main
        with:
          # BUNNYJS_SCRIPT_ID and BUNNYJS_DEPLOY_KEY are repo secrets; both come from the
          # bunny dashboard: Script -> Deployments -> Settings. The deploy key authorizes
          # exactly this one script, not the account.
          script_id: ${{ secrets.BUNNYJS_SCRIPT_ID }}
          deploy_key: ${{ secrets.BUNNYJS_DEPLOY_KEY }}
          file: "bunny_js/dist/index.js"
