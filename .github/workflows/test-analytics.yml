name: Test Analytics Service

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "analytics/**"
      - "shared/chain-utils/**"
      - "shared/s3-utils/**"
      - ".github/workflows/test-analytics.yml"
  push:
    branches:
      - main
    paths:
      - "analytics/**"
      - "shared/chain-utils/**"
      - "shared/s3-utils/**"
      - ".github/workflows/test-analytics.yml"

jobs:
  test-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            analytics/package-lock.json
            shared/chain-utils/package-lock.json
            shared/s3-utils/package-lock.json

      # Both shared packages must exist with a built dist/ before analytics'
      # npm ci — the file: dependencies snapshot them into node_modules at
      # install time, so building after would leave node_modules without dist.
      # test-facilitator.yml does the same for chain-utils; analytics is the
      # only consumer that also depends on @fretchen/s3-utils.
      - name: Build chain-utils dependency
        working-directory: ./shared/chain-utils
        run: npm ci && npm run build

      - name: Build s3-utils dependency
        working-directory: ./shared/s3-utils
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: ./analytics
        run: npm ci

      # npm run check = lint + format:check + typecheck + test:coverage. The
      # coverage run includes test/bundle.test.ts, which rebuilds dist/ with
      # the real tsdown.config.ts and loads both handlers in a child process
      # without node_modules — the failure mode that shipped a broken
      # function to production once.
      - name: Run quality checks (lint + format + test with coverage)
        working-directory: ./analytics
        run: npm run check
        env:
          NODE_ENV: test
          CI: true
