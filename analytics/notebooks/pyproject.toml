[project]
name = "analytics-notebooks"
version = "0.1.0"
description = "Python Jupyter notebooks for testing and reading out the analytics hit-counter service"
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "python-dotenv>=1.0",
    "requests>=2.33.0",
    "boto3>=1.34",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
