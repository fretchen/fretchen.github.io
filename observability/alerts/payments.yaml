# Loki alerting rules for the x402 payment path.
#
# Pushed from observability/ with `npx tsx scripts/alerts.ts --push`; never on deploy. Alerting config that changes as
# a side effect of shipping code is its own kind of surprise.
#
# ── TWO RULES, ON PURPOSE (cost) ─────────────────────────────────────────────────────────────
# Scaleway bills every active alert rule (€0.015/day each, checked 2026-10-04); the number of
# phrases a rule matches is free. So this file holds exactly TWO rules — one per selector (the
# cron, and the facilitator with its wallet-report cron) — and a new failure mode is a new
# alternative in the matching rule's line filter, never a new `- alert:`.
# test/alerts_budget.test.ts enforces the count. These conditions were six separate rules until
# 2026-10-04 (RefundEscrowStuck, PaymentCronFailed, FeeAllowanceLow; FacilitatorNeedsAttention,
# FacilitatorBroken, FacilitatorFeeCollectionFailed); they were merged for cost, then accidentally
# re-split by pushing an older committed file over an uncommitted consolidation. Do not split them
# back — the email's description and the log line say which phrase fired.
#
# ── What goes in, and what stays out ───────────────────────────────────────────────────────────
# Each phrase has to mean "a human needs to do something". The failure mode of alerting is not
# missing an alert, it is sending enough useless ones that people stop reading — which is how the
# refund bug survived for weeks in a log line that was printed every 12 hours.
#
# So: no bare `"Settlement failed"`, because most of those are a caller's bad signature or their
# own empty allowance, not our problem. No `"Cached channel state had drifted"`, because the
# repair working is the design.
#
# ── The `logger.error` convention ─────────────────────────────────────────────────────────────
# In both `x402_facilitator` and `scw_js`, `logger.error` means "ours, and should be alertable";
# a caller's fault (bad signature, malformed request, their own insufficient allowance) is
# `logger.warn`. Each package's own `test/alert_coverage.test.ts` asserts every `logger.error`
# call in that package is matched by a rule in these `alerts/*.yaml` (or is on that test's small,
# reasoned exemption list) — so a phrase added there without a matching rule fails CI instead of
# silently going unwatched, the way the original incident did.
#
# ── Why the windows are [1h] ───────────────────────────────────────────────────────────────────
# Scaleway's Loki ruler caps a range-vector window at 1h — a rule written as `[13h]` is rejected
# outright (`matrix selector range 13h0m0s exceeds maximum allowed limit of 1h0m0s`), so there is
# no way to keep an alert pinned open across the 12h gap between `llmx402cron` runs.
#
# The honest design given that cap: `[1h]` fires within an hour of the bad line appearing, then
# resolves — and if the underlying problem is still there, the next cron run produces the same
# line and the rule fires again 12h later. You get paged every time it recurs, just not
# continuously in between. A resolved notification here means "no new occurrence in the last
# hour", not "fixed" — read it that way, don't take it as confirmation.
name: payments
interval: 1m
rules:
  # The cron (llmx402cron). Branches, each its own rule until 2026-10-04:
  #
  # Escrow stuck — "still hold escrow": the post-condition of the refund sweep, and the most
  #   valuable phrase here. It is written against the OUTCOME, so it fires for causes nobody has
  #   thought of yet: a stale cached balance, a stale refundNonce, a failed refund transaction on
  #   Base and a withdrawDelay mismatch on Base Sepolia all presented identically as escrow that
  #   should have gone home.
  # Cron failed — "Refund sweep failed", "claimAndSettle failed", and "Failed to configure
  #   batch-settlement resource server", the cron's own copy of the startup check the bunny_js
  #   sellers used to share. services.yaml does not reach it: its selector is anchored against
  #   the genimg/growth functions, which never matches `…-llmx402cron`.
  # Fee allowance low — "Fee allowance nearly exhausted": days of lead time. claim/settle skip
  #   /verify, so this path gets no `remainingSettlements` warning from the facilitator — without
  #   this the approval simply runs out one day. (Was a warning; one rule carries one severity.)
  - alert: PaymentCronNeedsAttention
    expr: |
      sum(count_over_time({resource_name=~".+llmx402cron"} |~ "still hold escrow|Refund sweep failed|claimAndSettle failed|Failed to configure batch-settlement resource server|Fee allowance nearly exhausted" [1h])) > 0
    for: 0m
    labels:
      severity: critical
      area: payments
    annotations:
      summary: "The payment cron needs attention (stuck escrow, failed claim/refund, or low fee allowance)"
      description: >-
        "still hold escrow": the refund sweep left money behind — the cause is open, read the run.
        "Refund sweep failed" / "claimAndSettle failed" / "Failed to configure": claims or refunds
        threw, or the cron could not start (every network fails identically until fixed).
        "Fee allowance nearly exhausted": re-approve the fee token for the facilitator from the
        receiver wallet before claims start failing with insufficient_fee_allowance.
        Investigate: cd observability && npx tsx scripts/logs.ts llmx402cron --since 24h --grep "still hold escrow|failed|Failed to configure|allowance"
        Stuck escrow: cd scw_js && npx tsx scripts/recover_channels.ts eip155:10   (dry run; --apply to recover)

  # The facilitator's weekly wallet-report cron ONLY — the HTTP facilitator (settlement, fee
  # collection, unhandled-error branches) moved to bunny_js: its `logger.error` lines flush to
  # the custom bunny-logs source with a real `level` label, covered by BunnySellersNeedAttention
  # (alerts/bunny.yaml, service="facilitator"). What stays here is the report's own failure
  # surface, on the DEFAULT source the cron logs to:
  #   Email report failed / Email API returned — the report could not send. From the inbox,
  #     where the report's output lands, that is indistinguishable from a week with nothing to
  #     report, so it must page.
  #   Not configured — FACILITATOR_WALLET_PRIVATE_KEY unset: the report cannot even derive the
  #     wallet address, and every future run fails the same way until the secret returns.
  #     ("Failed to build wallet report for network" needs no phrase: that error is folded
  #     into the email body itself — x402_facilitator/test/alert_coverage.test.ts EXEMPT.)
  - alert: FacilitatorNeedsAttention
    expr: |
      sum(count_over_time({resource_name=~".+walletreportcron"} |~ "Email report failed|Email API returned|not configured" [1h])) > 0
    for: 0m
    labels:
      severity: critical
      area: payments
    annotations:
      summary: "The facilitator wallet report needs attention (could not send, or wallet unset)"
      description: >-
        "Email report failed" / "Email API returned": the weekly wallet report did not send —
        from the inbox that is indistinguishable from a quiet week, so the TEM config or email
        endpoint must be fixed. "not configured": FACILITATOR_WALLET_PRIVATE_KEY is unset, so
        the report cannot derive the wallet address; every run will fail until it is set. The
        facilitator itself (verify/settle/fee) now logs to the custom bunny-logs source and is
        alertable via BunnySellersNeedAttention (alerts/bunny.yaml).
        Investigate: cd observability && npx tsx scripts/logs.ts walletreportcron --since 8d
