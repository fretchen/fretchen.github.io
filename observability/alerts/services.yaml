# Loki alerting rules for the scw_js service functions.
#
# Pushed from observability/ with `npx tsx scripts/alerts.ts --push alerts/services.yaml`; never
# on deploy. A separate group from `payments.yaml` in the same namespace — pushing one leaves the
# other alone.
#
# ── ONE RULE, ON PURPOSE (cost) ──────────────────────────────────────────────────────────────
# Scaleway bills every active alert rule (€0.015/day each, checked 2026-10-04); the number of
# phrases a rule matches is free. So this file holds exactly ONE rule, and a new failure mode is a
# new alternative in its line filter, never a new `- alert:`. test/alerts_budget.test.ts enforces
# the count. These conditions were six separate rules until 2026-10-04 (UpstreamProviderFailing,
# ServiceKeyMissing, PaidPathBroken, PaidButUndelivered, ServiceUnhandledError,
# SellerPaymentFailing); they were merged for cost, then accidentally re-split by pushing an older
# committed file over an uncommitted consolidation. Do not split them back — the email's
# description and the log line say which phrase fired.
#
# Covers llmx402, searchapi, genimgx402token and growthapi. The claim/refund cron is NOT here;
# `payments.yaml` owns llmx402cron and the facilitator.
#
# ── Why now ────────────────────────────────────────────────────────────────────────────────────
# Because /search and /fetch are becoming paid, public routes. A Brave outage used to degrade a
# tool the owner used; now it breaks something a stranger has paid for, against a published price
# list, and nothing anywhere would say so.
#
# ── Two things this rule depends on, both checked rather than assumed ───────────────────────────
# 1. Loki ANCHORS label regexes. `resource_name=~".+llmx402"` matches `…-llmx402` and never
#    `…-llmx402cron` — verified by query. Without that the rule here would fire on the cron's lines
#    too, and it is also what keeps payments.yaml correct.
# 2. MATCH THE BARE PHRASE, never `msg="..."`. Scaleway stores each line as a JSON envelope
#    (`{"message":"…","stream":"stdout"}`), so the pino text inside it is JSON-ENCODED: what is
#    actually stored is `msg=\"Answer generated and settled\"`, backslashes and all. A filter
#    written as `msg="Answer generated and settled"` therefore matches nothing, silently, forever.
#    This was not theoretical — the first version of this file used that form for three of its then
#    five rules and none of them could ever have fired. It was caught only by pushing a throwaway rule
#    against a line known to exist and finding zero matches, which is the argument for doing that
#    before trusting any rule here.
#
#    Bare phrases are what payments.yaml uses too. The precision
#    the `msg=` prefix was meant to buy (not matching the same words inside a serialized `err`) is
#    not worth having at the price of not matching at all; these phrases are distinctive enough.
#
#    For the same reason the genimg matchers drop the `❌` those lines are prefixed with. It may
#    well survive into Loki intact, but genimgx402token has logged nothing but a startup line in
#    the whole 7-day retention window, so there is no way to CHECK — and an unverifiable character
#    in a matcher is what the paragraph above is about. The text after it is distinctive on its own.
#
# ── Windows ────────────────────────────────────────────────────────────────────────────────────
# `[1h]`, the maximum Scaleway's ruler accepts (see payments.yaml for the full reasoning). These
# functions serve continuously rather than on a 12h cron, so an hour is a reasonable window
# rather than a compromise.
name: services
interval: 1m
rules:
  # The branches of the one filter below, in order. Each was its own rule until 2026-10-04.
  #
  # Upstream refusing us — "LLM API error", "Could not reach Brave|BFL", "Upstream returned a
  #   completion we cannot bill from": a metered provider answered 401 (key revoked), 429 (quota) or
  #   5xx (their outage), or the LLM sent a shape we cannot bill from. Breaks a PAID product
  #   silently: the request fails, we never settle, and this line is the only trace. Only the LLM
  #   provider logs its own line; Brave and BFL throw, so their text is matched inside the
  #   serialized `err` of whichever handler caught it. ("Could not reach <host>" from /fetch is the
  #   caller's chosen page and is logged at warn — it does not match "Could not reach Brave".)
  # Key missing — "API token not found. Please configure the": thrown before any HTTP call, so no
  #   "could not reach" line exists. One string covers BRAVE_API_KEY, MISTRAL_API_KEY and
  #   BFL_API_TOKEN. An unset secret deploys as an EMPTY one, so a successful-looking deploy can
  #   still produce this.
  # Paid path cannot be served — the x402 seller could not be constructed, an address it needs is
  #   missing, or genimg's wallet is out of gas ("Pre-flight check failed"). Both wallet-key phrases
  #   are deliberate: NFT_WALLET_PUBLIC_KEY (fee receiver) and NFT_WALLET_PRIVATE_KEY (genimg's
  #   minting wallet) are different env vars, and dropping either leaves that misconfiguration
  #   unalertable.
  # Paid but undelivered — "Mint failed after successful generation": the only branch where money
  #   moved and a customer is owed something. The buyer got a 200, so nothing else will notice.
  # Unhandled error — the outer catch blocks. Caller faults are split off to 400/404 before them, so
  #   what lands here is ours or something nobody anticipated. If it fires on a caller's fault,
  #   classify that input properly in the service (as web_fetch_service.ts does for timeouts) — do
  #   not remove the phrase.
  # Seller payment failing — our own verify/settle call to the facilitator threw or was refused.
  #   Can be a caller's malformed payload; if the facilitator itself is down, payments.yaml's
  #   FacilitatorNeedsAttention fires on its own logs too.
  #
  # No `!~` exclusion. As separate rules, ServiceUnhandledError dropped lines carrying the upstream
  # phrases so one outage paged once. In a single rule that exclusion would suppress the very
  # upstream lines this rule now also covers — and one rule pages once anyway.
  #
  # One severity for all branches: critical. Upstream, key, paid-path and NFT failures were
  # critical before; unhandled errors and seller payment failures were warnings. The description
  # says which is which.
  - alert: ServicesNeedAttention
    expr: |
      sum(count_over_time({resource_name=~".+(llmx402|searchapi|genimgx402token|growthapi)"} |~ "LLM API error|Could not reach Brave|Could not reach BFL|Upstream returned a completion we cannot bill from|API token not found. Please configure the|Failed to configure batch-settlement resource server|NFT_WALLET_PUBLIC_KEY not configured|NFT_WALLET_PRIVATE_KEY not configured|OWNER_ETH_ADDRESS not configured|Pre-flight check failed|Mint failed after successful generation|Request handler error|Paid request handler error|Error during operation|Auth verification failed|Error during answer generation|Payment verification error|Settlement error|Settlement failed" [1h])) > 0
    for: 0m
    labels:
      severity: critical
      area: services
    annotations:
      summary: "A scw_js service needs attention (upstream, config, unhandled error, NFT, or payment)"
      description: >-
        The log line says which. "LLM API error" / "Could not reach Brave|BFL" / "cannot bill from":
        a paid upstream refuses us (401 key, 429 quota, 5xx outage). "API token not found": a
        secret is unset on the deployed function. "not configured" / "Failed to configure" /
        "Pre-flight check failed": the paid path cannot be served (missing address, or genimg out of
        gas). "Mint failed after successful generation": a buyer paid and is owed an NFT.
        "handler error" / "Error during …" / "Auth verification failed": an unhandled error (a
        warning — a bug, or input nobody classified yet). "Payment verification error" /
        "Settlement …": our call to the facilitator failed (a warning — check payments alerts).
        Investigate: cd observability && npx tsx scripts/logs.ts searchapi --since 6h --grep "Could not reach|API token not found|not configured|Pre-flight|handler error|Error during|Settlement"
        Same for llmx402 / genimgx402token / growthapi. NFT owed: --grep "Mint failed" on genimgx402token.
