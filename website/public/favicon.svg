<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- opaque tile: the light "face" is carried by the icon, not by the page -->
  <rect width="64" height="64" rx="10" fill="#FFFFFF"/>
  <g fill="#0066CC">
    <!-- ears -->
    <path d="M 18 15 L 24.5 3.5 L 31 15 Z   M 33 15 L 39.5 3.5 L 46 15 Z"/>
    <!-- face -->
    <rect x="9" y="15" width="46" height="46" fill="none" stroke="#0066CC" stroke-width="4"/>
    <!-- goggles -->
    <rect x="18" y="25" width="11" height="11"/>
    <rect x="35" y="25" width="11" height="11"/>
    <rect x="29" y="29" width="6" height="3"/>
    <!-- smile -->
    <path d="M 22 45 A 10 10 0 0 0 42 45 Z"/>
  </g>
</svg>
