service: x402-facilitator

# Read environment variables from a .env file
useDotenv: true

configValidationMode: off
provider:
  name: scaleway
  runtime: node22
  # Environment variables for production
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    # Fee amount in USDC smallest unit (6 decimals): 10000 = 0.01 USDC. Read by the weekly
    # report's nominal-fee arithmetic (wallet_report_fee.ts); the facilitator itself now
    # carries its own copy on the bunny script.
    FACILITATOR_FEE_AMOUNT: "10000"
    # Weekly wallet report (walletreportcron): warn when native gas balance drops below
    # this many ETH. Public value — the actual send is gated on the TEM secrets below.
    LOW_GAS_THRESHOLD_ETH: ${env:LOW_GAS_THRESHOLD_ETH, '0.005'}
  # Secrets (set via Scaleway Console or CLI)
  secret:
    FACILITATOR_WALLET_PRIVATE_KEY: ${env:FACILITATOR_WALLET_PRIVATE_KEY}
    # Scaleway Transactional Email — used by walletreportcron to send the weekly report.
    # SCW_SECRET_KEY doubles as the TEM X-Auth-Token (same value comment_service uses).
    SCW_SECRET_KEY: ${env:SCW_SECRET_KEY, ''}
    TEM_PROJECT_ID: ${env:TEM_PROJECT_ID, ''}
    NOTIFICATION_EMAIL: ${env:NOTIFICATION_EMAIL, ''}
    # Per-network RPC endpoints (see getRpcUrl in chain_utils.ts). Unset => viem falls
    # back to the chain's public endpoint, which is aggressively rate-limited: a single
    # batch-settlement deposit does a Multicall3 read batch and fails with "over rate
    # limit", surfacing as the generic ..._deposit_transaction_failed. Set these for any
    # network carrying real traffic. A real value embeds an API key (e.g. an Alchemy
    # URL) — secret, not env.
    RPC_URL_EIP155_8453: ${env:RPC_URL_EIP155_8453, ''}
    RPC_URL_EIP155_10: ${env:RPC_URL_EIP155_10, ''}
    RPC_URL_EIP155_84532: ${env:RPC_URL_EIP155_84532, ''}
    RPC_URL_EIP155_11155420: ${env:RPC_URL_EIP155_11155420, ''}

plugins:
  - serverless-scaleway-functions

package:
  patterns:
    # Exclude everything, then include ONLY the bundled runtime output.
    # (tsdown inlines all deps into dist/*.js, so nothing else is needed at runtime.)
    # This is robust: it won't accidentally package new large dirs like
    # notebooks/node_modules (created by Deno), which previously bloated the
    # upload archive past Scaleway's limit.
    - "!**"
    - "dist/**"
    - "!dist/**/*.map"

functions:
  # Weekly (Mondays 08:00 UTC) email report of wallet balances + 7-day USDC activity.
  # The HTTP facilitator that used to live here moved to bunny_js (facilitator.fretchen.eu
  # is served by the fretchen-facilitator Edge Script); this package deploys the cron only.
  walletreportcron:
    handler: dist/wallet_report_cron.handle
    description: "Weekly facilitator wallet balance + USDC activity email"
    memoryLimit: 256
    timeout: 60s
    events:
      - schedule:
          # Scaleway's cron validator rejects the standard */N step syntax; plain fields
          # are fine here. "0 8 * * 1" = Mondays at 08:00 UTC.
          rate: "0 8 * * 1"
